<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>TailwindCSS v4 Layout (No Sidebar)</title>
  </head>
  <body>
    <div class="grid min-h-screen w-full grid-cols-1 grid-rows-[4rem_1fr_4rem]">
      <header
        class="flex w-full items-center justify-between border-b border-slate-200 bg-white px-4 sm:px-6 lg:px-8"
      >
        <span class="font-bold text-slate-900">Brand</span>
        <nav class="flex items-center gap-4 text-sm text-slate-600">
          <a href="#" class="hover:text-slate-900">Home</a>
          <a href="#" class="hover:text-slate-900">About</a>
          <a href="#" class="hover:text-slate-900">Contact</a>
        </nav>
      </header>

      <main
        class="grid w-full grid-cols-1 gap-6 bg-slate-50 p-4 sm:p-6 md:grid-cols-2 lg:p-8"
      >
        <section class="rounded-lg border border-slate-200 bg-white p-6">
          Column 1 Content
        </section>

        <section class="rounded-lg border border-slate-200 bg-white p-6">
          Column 2 Content
        </section>
      </main>

      <footer
        class="flex w-full items-center border-t border-slate-200 bg-white px-4 text-sm text-slate-500 sm:px-6 lg:px-8"
      >
        Footer
      </footer>
    </div>
  </body>
</html>
