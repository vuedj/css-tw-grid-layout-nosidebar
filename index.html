<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>TailwindCSS v4 Layout (No Sidebar)</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div class="flex min-h-screen flex-col">
      <header
        class="sticky top-0 z-30 w-full border-b border-slate-200/80 bg-white/85 backdrop-blur-md"
      >
        <div
          class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 md:px-0"
        >
          <a href="#" class="flex items-center gap-2 font-bold text-slate-900">
            <span
              class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-sm font-extrabold text-white shadow-sm"
            >
              B
            </span>
            <span class="text-lg tracking-tight">Brand</span>
          </a>

          <nav
            class="hidden items-center gap-6 text-sm font-medium text-slate-600 sm:flex"
            aria-label="Main Navigation"
          >
            <a href="#" class="text-indigo-600 font-semibold">Home</a>
            <a href="#" class="transition-colors hover:text-slate-900">About</a>
            <a href="#" class="transition-colors hover:text-slate-900"
              >Contact</a
            >
            <a
              href="#"
              class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-xs transition-colors hover:bg-indigo-500"
            >
              Get Started
            </a>
          </nav>

          <button
            id="mobile-menu-btn"
            onclick="toggleMobileMenu()"
            type="button"
            class="relative inline-flex h-10 w-10 items-center justify-center rounded-lg text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900 focus:ring-2 focus:ring-indigo-500/40 focus:outline-none sm:hidden"
            aria-controls="mobile-menu"
            aria-expanded="false"
            aria-label="Toggle navigation menu"
          >
            <span class="sr-only">Open main menu</span>
            <div class="relative h-4 w-5">
              <span
                id="line-1"
                class="absolute top-0 left-0 h-0.5 w-5 rounded-full bg-current transition-all duration-300 ease-in-out"
              ></span>
              <span
                id="line-2"
                class="absolute top-1.5 left-0 h-0.5 w-5 rounded-full bg-current transition-all duration-200 ease-in-out"
              ></span>
              <span
                id="line-3"
                class="absolute top-3 left-0 h-0.5 w-5 rounded-full bg-current transition-all duration-300 ease-in-out"
              ></span>
            </div>
          </button>
        </div>

        <div
          id="mobile-menu"
          class="grid grid-rows-[0fr] opacity-0 transition-all duration-300 ease-in-out sm:hidden"
        >
          <div class="overflow-hidden">
            <nav
              class="space-y-1.5 border-t border-slate-100 bg-white px-4 pt-3 pb-5 shadow-xl"
              aria-label="Mobile Navigation"
            >
              <a
                href="#"
                aria-current="page"
                class="flex items-center gap-3 rounded-xl bg-indigo-50/80 px-3.5 py-2.5 text-base font-semibold text-indigo-600"
              >
                <svg
                  class="h-5 w-5 shrink-0"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
                  />
                </svg>
                <span>Home</span>
              </a>

              <a
                href="#"
                class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-base font-medium text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900"
              >
                <svg
                  class="h-5 w-5 shrink-0 text-slate-400"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  />
                </svg>
                <span>About</span>
              </a>

              <a
                href="#"
                class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-base font-medium text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900"
              >
                <svg
                  class="h-5 w-5 shrink-0 text-slate-400"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                  />
                </svg>
                <span>Contact</span>
              </a>

              <div class="pt-3">
                <a
                  href="#"
                  class="flex w-full items-center justify-center rounded-xl bg-indigo-600 px-4 py-2.5 text-center text-base font-semibold text-white shadow-sm transition-colors hover:bg-indigo-500"
                >
                  Get Started
                </a>
              </div>
            </nav>
          </div>
        </div>
      </header>

      <div
        id="menu-backdrop"
        onclick="toggleMobileMenu()"
        class="pointer-events-none fixed inset-0 z-20 bg-slate-900/30 opacity-0 backdrop-blur-xs transition-opacity duration-300 sm:hidden"
      ></div>

      <section
        id="hero-carousel"
        class="relative w-full overflow-hidden bg-slate-900 h-[calc(100svh-4rem)]"
        aria-label="Hero carousel"
        aria-roledescription="carousel"
      >
        <div id="carousel-slides" class="absolute inset-0"></div>

        <div
          class="pointer-events-none absolute inset-x-0 bottom-0 h-1/3 bg-gradient-to-t from-slate-950/70 to-transparent"
        ></div>

        <div class="pointer-events-none absolute inset-0 flex items-end">
          <div
            class="mx-auto w-full max-w-7xl px-4 pb-20 sm:px-6 sm:pb-24 lg:px-8"
          >
            <p
              id="slide-kicker"
              class="text-sm font-semibold tracking-[0.2em] text-indigo-200 uppercase"
            ></p>
            <h1
              id="slide-title"
              class="mt-3 max-w-3xl text-4xl font-bold tracking-tight text-white drop-shadow-lg sm:text-5xl lg:text-6xl"
            ></h1>
            <p
              id="slide-description"
              class="mt-4 max-w-xl text-base text-slate-100 drop-shadow sm:text-lg"
            ></p>
          </div>
        </div>

        <button
          type="button"
          id="prev-slide"
          aria-label="Previous slide"
          class="absolute top-1/2 left-4 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white/20 text-white backdrop-blur-sm transition hover:bg-white/35 focus:ring-2 focus:ring-white/70 focus:outline-none sm:left-8"
        >
          <svg
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </button>
        <button
          type="button"
          id="next-slide"
          aria-label="Next slide"
          class="absolute top-1/2 right-4 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white/20 text-white backdrop-blur-sm transition hover:bg-white/35 focus:ring-2 focus:ring-white/70 focus:outline-none sm:right-8"
        >
          <svg
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </button>

        <div
          id="carousel-dots"
          class="absolute inset-x-0 bottom-8 flex items-center justify-center gap-2.5"
          role="group"
          aria-label="Choose slide"
        ></div>
      </section>

      <main class="flex-1 w-full p-4 sm:p-6 lg:p-8">
        <section
          class="mx-auto grid w-full max-w-7xl grid-cols-1 gap-6 md:grid-cols-2"
        >
          <div
            class="rounded-xl border border-slate-200 bg-white p-6 shadow-2xs"
          >
            Column 1 Content
          </div>

          <div
            class="rounded-xl border border-slate-200 bg-white p-6 shadow-2xs"
          >
            Column 2 Content
          </div>
        </section>
      </main>

      <footer
        class="w-full border-t border-slate-200 bg-white text-sm text-slate-500"
      >
        <div class="mx-auto flex h-16 max-w-7xl items-center px-4 md:px-0">
          Footer
        </div>
      </footer>
    </div>

    <script>
      const mobileMenu = document.getElementById("mobile-menu");
      const mobileMenuBtn = document.getElementById("mobile-menu-btn");
      const menuBackdrop = document.getElementById("menu-backdrop");
      const line1 = document.getElementById("line-1");
      const line2 = document.getElementById("line-2");
      const line3 = document.getElementById("line-3");

      let isOpen = false;

      function toggleMobileMenu() {
        isOpen = !isOpen;
        mobileMenuBtn.setAttribute("aria-expanded", String(isOpen));

        mobileMenu.classList.toggle("grid-rows-[0fr]", !isOpen);
        mobileMenu.classList.toggle("grid-rows-[1fr]", isOpen);
        mobileMenu.classList.toggle("opacity-0", !isOpen);
        mobileMenu.classList.toggle("opacity-100", isOpen);

        menuBackdrop.classList.toggle("opacity-0", !isOpen);
        menuBackdrop.classList.toggle("opacity-100", isOpen);
        menuBackdrop.classList.toggle("pointer-events-none", !isOpen);

        line1.classList.toggle("top-0", !isOpen);
        line1.classList.toggle("top-1.5", isOpen);
        line1.classList.toggle("rotate-45", isOpen);

        line2.classList.toggle("opacity-0", isOpen);

        line3.classList.toggle("top-3", !isOpen);
        line3.classList.toggle("top-1.5", isOpen);
        line3.classList.toggle("-rotate-45", isOpen);
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && isOpen) {
          toggleMobileMenu();
        }
      });

      const carousel = [
        {
          image: "https://picsum.photos/seed/brand-hero-1/1920/1080",
          kicker: "Explore",
          title: "Welcome to Brand",
          description: "Build better products faster with our modern toolkit.",
        },
        {
          image: "https://picsum.photos/seed/brand-hero-2/1920/1080",
          kicker: "Create",
          title: "Design without limits",
          description:
            "Everything you need to bring your boldest ideas to life.",
        },
        {
          image: "https://picsum.photos/seed/brand-hero-3/1920/1080",
          kicker: "Build",
          title: "Ship with confidence",
          description: "A reliable foundation for teams that move fast.",
        },
        {
          image: "https://picsum.photos/seed/brand-hero-4/1920/1080",
          kicker: "Grow",
          title: "Scale your vision",
          description:
            "From first prototype to millions of users, we grow with you.",
        },
      ];

      const slidesContainer = document.getElementById("carousel-slides");
      const dotsContainer = document.getElementById("carousel-dots");
      const kickerEl = document.getElementById("slide-kicker");
      const titleEl = document.getElementById("slide-title");
      const descriptionEl = document.getElementById("slide-description");
      const heroSection = document.getElementById("hero-carousel");

      let currentSlide = 0;
      let autoplayInterval;
      let isHovered = false;

      carousel.forEach((slide, index) => {
        const slideEl = document.createElement("div");
        slideEl.className =
          "absolute inset-0 bg-cover bg-center opacity-0 transition-opacity duration-700 ease-in-out";
        slideEl.style.backgroundImage = `url('${slide.image}')`;
        slideEl.setAttribute("role", "group");
        slideEl.setAttribute("aria-roledescription", "slide");
        slideEl.setAttribute(
          "aria-label",
          `${index + 1} of ${carousel.length}`
        );
        slideEl.setAttribute("aria-hidden", String(index !== 0));
        slidesContainer.appendChild(slideEl);

        const dot = document.createElement("button");
        dot.type = "button";
        dot.setAttribute("aria-label", `Go to slide ${index + 1}`);
        dot.setAttribute("aria-current", String(index === 0));
        dot.className =
          "h-2.5 w-2.5 rounded-full bg-white/50 transition-all duration-300 hover:bg-white focus:ring-2 focus:ring-white/70 focus:outline-none";
        dot.addEventListener("click", () => {
          goToSlide(index);
          resetAutoplay();
        });
        dotsContainer.appendChild(dot);
      });

      const slideEls = slidesContainer.querySelectorAll("[role='group']");
      const dotEls = dotsContainer.querySelectorAll("button");

      function goToSlide(index) {
        currentSlide = (index + carousel.length) % carousel.length;

        slideEls.forEach((slide, i) => {
          slide.classList.toggle("opacity-100", i === currentSlide);
          slide.classList.toggle("opacity-0", i !== currentSlide);
          slide.setAttribute("aria-hidden", String(i !== currentSlide));
        });

        dotEls.forEach((dot, i) => {
          dot.classList.toggle("bg-white", i === currentSlide);
          dot.classList.toggle("scale-125", i === currentSlide);
          dot.classList.toggle("bg-white/50", i !== currentSlide);
          dot.setAttribute("aria-current", String(i === currentSlide));
        });

        const slide = carousel[currentSlide];
        kickerEl.textContent = slide.kicker;
        titleEl.textContent = slide.title;
        descriptionEl.textContent = slide.description;
      }

      function nextSlide() {
        goToSlide(currentSlide + 1);
      }

      function prevSlide() {
        goToSlide(currentSlide - 1);
      }

      function startAutoplay() {
        clearInterval(autoplayInterval);
        if (!isHovered) {
          autoplayInterval = setInterval(nextSlide, 6000);
        }
      }

      function resetAutoplay() {
        clearInterval(autoplayInterval);
        if (!isHovered) {
          autoplayInterval = setInterval(nextSlide, 6000);
        }
      }

      document.getElementById("next-slide").addEventListener("click", () => {
        nextSlide();
        resetAutoplay();
      });
      document.getElementById("prev-slide").addEventListener("click", () => {
        prevSlide();
        resetAutoplay();
      });

      heroSection.addEventListener("mouseenter", () => {
        isHovered = true;
        clearInterval(autoplayInterval);
      });
      heroSection.addEventListener("mouseleave", () => {
        isHovered = false;
        startAutoplay();
      });

      heroSection.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          nextSlide();
          resetAutoplay();
        } else if (event.key === "ArrowLeft") {
          prevSlide();
          resetAutoplay();
        }
      });

      goToSlide(0);
      startAutoplay();
    </script>
  </body>
</html>
